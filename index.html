<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CampusCode</title>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="shortcut icon" href="/favicon.svg?v=2" />

    <!-- Google Fonts for 100% exact typographic match -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,400&family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- CampusCode Official Stylesheet -->
    <link rel="stylesheet" href="/src/campus-original.css?v=student-theme-20261107-8" />

    <style>
      /* Floating Switcher Toolbar for Unstop Reviewers & Hackathon Evaluators */
      #rebuild26-switcher {
        position: fixed;
        bottom: 16px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 999999;
        background: rgba(17, 17, 17, 0.95);
        border: 1px solid rgba(255, 255, 255, 0.15);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
        backdrop-filter: blur(12px);
        padding: 6px 14px;
        border-radius: 999px;
        display: flex;
        align-items: center;
        gap: 8px;
        font-family: 'DM Mono', monospace;
        font-size: 11px;
      }
      #rebuild26-switcher .badge {
        background: #a8e62e;
        color: #111;
        font-weight: 800;
        padding: 3px 8px;
        border-radius: 999px;
        letter-spacing: 0.5px;
      }
      #rebuild26-switcher .nav-btn {
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: #deded8;
        padding: 5px 12px;
        border-radius: 999px;
        cursor: pointer;
        font-weight: 600;
        transition: all 0.2s;
        text-decoration: none;
      }
      #rebuild26-switcher .nav-btn:hover {
        background: rgba(255, 255, 255, 0.2);
        color: #fff;
      }
      #rebuild26-switcher .nav-btn.active {
        background: #7665ff;
        color: #fff;
        border-color: #7665ff;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>

    <!-- Reviewer Quick-Switch Bar for instant evaluation of the 4 flows -->
    <div id="rebuild26-switcher">
      <span class="badge">ReBuild '26</span>
      <button class="nav-btn" onclick="goToRoute('/')">1. Landing Dashboard</button>
      <button class="nav-btn" onclick="goToRoute('/login')">2. Login</button>
      <button class="nav-btn" onclick="goToRoute('/register')">3. Register</button>
      <button class="nav-btn" onclick="goToRoute('/student')">4. Student Dashboard</button>
    </div>

    <script>
      function goToRoute(path) {
        window.history.pushState({}, '', path);
        window.dispatchEvent(new PopStateEvent('popstate'));
        updateButtons();
      }
      function updateButtons() {
        const cur = window.location.pathname;
        const btns = document.querySelectorAll('#rebuild26-switcher .nav-btn');
        btns.forEach(b => {
          if (
            (cur === '/' && b.innerText.includes('Landing')) ||
            (cur.startsWith('/login') && b.innerText.includes('Login')) ||
            (cur.startsWith('/register') && b.innerText.includes('Register')) ||
            (cur.startsWith('/student') && b.innerText.includes('Student'))
          ) {
            b.classList.add('active');
          } else {
            b.classList.remove('active');
          }
        });
      }
      window.addEventListener('popstate', updateButtons);
      window.addEventListener('DOMContentLoaded', updateButtons);
      setTimeout(updateButtons, 500);
    </script>

    <!-- Main Engine -->
    <script type="module" src="/src/scroll-reveal.js"></script>
    <script type="module" src="/src/original_runtime.js"></script>
  </body>
</html>
